<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pour Maman 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #fdf7ee;
      --gold:     #C9A84C;
      --gold-lt:  #e8d080;
      --gold-dim: #9a7830;
      --rose:     #c86070;
      --rose-lt:  #f0b8c4;
      --burg:     #8B1A2F;
      --text:     #3a2818;
      --text-lt:  #8a6848;
    }

    body {
      background: radial-gradient(ellipse at 50% 10%, #fffaf2 0%, #fdf0e0 50%, #f8e4d0 100%);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── FLOATING PETALS ─── */
    #petals {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .petal {
      position: absolute;
      pointer-events: none; opacity: 0;
      animation: petalDrift linear forwards;
    }
    @keyframes petalDrift {
      0%   { opacity: 0;   transform: translateY(-20px) translateX(0) rotate(0deg); }
      7%   { opacity: 0.75; }
      45%  { transform: translateY(42vh) translateX(32px) rotate(135deg); opacity: 0.65; }
      80%  { transform: translateY(82vh) translateX(-20px) rotate(275deg); opacity: 0.3; }
      100% { transform: translateY(112vh) translateX(6px) rotate(350deg); opacity: 0; }
    }

    /* ─── DECORATIVE CIRCLES ─── */
    #deco-circles {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
    }
    .deco-c {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.12);
    }

    /* ─── SCENES ─── */
    #scene-intro, #scene-cards {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.4rem; text-align: center; padding: 1.5rem;
    }
    #scene-cards { display: none; }

    /* ─── INTRO TEXT ─── */
    .intro-pre {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.88rem, 2.5vw, 1.15rem);
      color: var(--gold-dim);
      letter-spacing: 0.06em;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 0.4s;
    }
    .intro-main {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      color: var(--text);
      line-height: 1.2;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 0.9s;
    }
    .intro-hint {
      font-size: clamp(0.62rem, 1.8vw, 0.78rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-lt);
      opacity: 0;
      animation: fadeUp 1s ease forwards 2.6s;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── ENVELOPE ─── */
    .env-container {
      position: relative;
      width: min(400px, 88vw);
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 1.6s;
    }
    .env-container svg.env-svg { width: 100%; height: auto; display: block; }
    .env-container.opening {
      animation: envFade 0.65s ease-in forwards;
    }
    @keyframes envFade {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(1.05) translateY(-10px); }
    }

    /* ─── WAX SEAL ─── */
    #wax-seal {
      -webkit-appearance: none; appearance: none;
      border: none; padding: 0; margin: 0;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(62px, 17vw, 84px);
      height: clamp(62px, 17vw, 84px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 30%, rgba(220,70,85,0.45) 0%, transparent 45%),
        radial-gradient(circle at 62% 68%, rgba(55,0,15,0.35) 0%, transparent 42%),
        radial-gradient(ellipse at 50% 50%, #c01e2c 0%, #7e0e1c 60%, #500810 100%);
      box-shadow:
        3px 5px 12px rgba(70,0,20,0.5),
        inset -2px -3px 9px rgba(0,0,0,0.35),
        inset 2px 2px 5px rgba(240,110,110,0.2),
        0 0 0 2.5px rgba(201,168,76,0.8),
        0 0 0 5px rgba(201,168,76,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    #wax-seal:hover {
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow:
        4px 6px 16px rgba(70,0,20,0.55),
        inset -2px -3px 9px rgba(0,0,0,0.35),
        inset 2px 2px 5px rgba(240,110,110,0.2),
        0 0 0 2.5px rgba(201,168,76,1),
        0 0 14px rgba(201,168,76,0.45);
    }
    #wax-seal.breaking {
      pointer-events: none;
      animation: sealBreak 0.7s ease-out forwards;
    }
    @keyframes sealBreak {
      0%   { transform: translate(-50%, -50%) scale(1);    opacity: 1; filter: brightness(1); }
      25%  { transform: translate(-50%, -50%) scale(1.18) rotate(6deg);  filter: brightness(2); }
      65%  { transform: translate(-50%, -50%) scale(1.35) rotate(-4deg); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(0)    rotate(12deg); opacity: 0; }
    }

    /* ─── SPARKLES ─── */
    .sparkle {
      position: fixed; pointer-events: none; z-index: 200;
      border-radius: 50%;
      animation: sparkleOut 1s ease-out forwards;
    }
    @keyframes sparkleOut {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx),var(--ty)) scale(0); opacity: 0; }
    }

    /* ─── GIFT CARDS ─── */
    .cards-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      color: var(--gold-dim);
      letter-spacing: 0.06em;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.3s;
    }

    .cards-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      justify-content: center;
      align-items: flex-start;
    }

    .gift-card {
      width: clamp(158px, 41vw, 195px);
      border-radius: 14px;
      background: var(--cream);
      border: 1.5px solid rgba(201,168,76,0.4);
      box-shadow:
        0 10px 32px rgba(150,80,40,0.13),
        0 3px 10px rgba(150,80,40,0.08);
      overflow: hidden;
      position: relative;
      opacity: 0;
    }
    .gift-card:nth-child(1) { animation: cardIn1 0.85s cubic-bezier(0.22,1,0.36,1) forwards 0.1s; }
    .gift-card:nth-child(2) { animation: cardIn2 0.85s cubic-bezier(0.22,1,0.36,1) forwards 0.28s; }

    @keyframes cardIn1 {
      from { opacity: 0; transform: translateX(-24px) rotate(-4deg) scale(0.88); }
      to   { opacity: 1; transform: translateX(0) rotate(-1.2deg) scale(1); }
    }
    @keyframes cardIn2 {
      from { opacity: 0; transform: translateX(24px) rotate(4deg) scale(0.88); }
      to   { opacity: 1; transform: translateX(0) rotate(1.2deg) scale(1); }
    }

    /* Gold header band */
    .card-header {
      background: linear-gradient(110deg, #a87c28, #c9a44a, #e4c870, #d4b050, #a87c28);
      padding: 0.65rem 0.8rem 0.55rem;
      text-align: center;
    }
    .card-brand {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.3em;
      color: #fdf7ee;
      text-transform: uppercase;
    }
    .card-subbrand {
      font-size: 0.52rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,245,218,0.8);
      margin-top: 0.15rem;
    }

    /* Card body */
    .card-body {
      padding: 1rem 0.9rem 0.8rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.6rem;
    }
    .card-icon { width: 46px; height: 46px; }

    .card-divider {
      width: 68%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
    }

    .card-product {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.05rem, 3.5vw, 1.22rem);
      color: var(--text);
      text-align: center;
      line-height: 1.25;
      letter-spacing: 0.015em;
    }
    .card-type {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-lt);
      margin-top: -0.2rem;
    }

    /* Card footer */
    .card-footer {
      background: rgba(201,168,76,0.07);
      border-top: 1px solid rgba(201,168,76,0.22);
      padding: 0.6rem 0.8rem;
      text-align: center;
    }
    .card-gift {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-dim);
    }

    /* Floral watermark on card */
    .card-wm {
      position: absolute;
      bottom: 38px; right: -18px;
      width: 85px;
      opacity: 0.055;
      pointer-events: none;
    }

    /* ─── BDAY MESSAGE ─── */
    .bday-block {
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1s;
    }
    .bday-main {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.15rem, 3.8vw, 1.55rem);
      color: var(--text);
    }
    .bday-sub {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.8rem, 2.3vw, 0.95rem);
      color: var(--text-lt);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>

<!-- Floating petals -->
<div id="petals"></div>

<!-- Subtle decorative circles (bokeh feel) -->
<div id="deco-circles">
  <div class="deco-c" style="width:280px;height:280px;top:-80px;left:-80px;"></div>
  <div class="deco-c" style="width:200px;height:200px;bottom:5vh;right:-50px;border-color:rgba(200,96,112,0.1)"></div>
  <div class="deco-c" style="width:120px;height:120px;top:15vh;right:8vw;border-color:rgba(201,168,76,0.08)"></div>
  <div class="deco-c" style="width:80px;height:80px;bottom:20vh;left:6vw;border-color:rgba(200,96,112,0.08)"></div>
</div>


<!-- ══ SCENE 1 — ENVELOPE ══ -->
<div id="scene-intro">

  <p class="intro-pre">Un petit quelque chose pour toi…</p>
  <p class="intro-main">Bon anniversaire, Maman 🌸</p>

  <!-- Envelope + wax seal -->
  <div class="env-container" id="env-container">

    <svg class="env-svg" viewBox="0 0 400 244" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="envShad" x="-8%" y="-8%" width="120%" height="130%">
          <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="rgba(140,80,40,0.18)"/>
        </filter>
      </defs>

      <!-- Envelope body (with shadow) -->
      <rect width="400" height="244" rx="8" fill="#fdf8f2" filter="url(#envShad)"/>

      <!-- Interior fold triangles -->
      <path d="M0,244 L200,136 L400,244 Z" fill="#f0e4d0"/>
      <path d="M0,0   L0,244 L200,136 Z"   fill="#f5ecde"/>
      <path d="M400,0 L400,244 L200,136 Z" fill="#f5ecde"/>
      <path d="M0,0   L400,0  L200,136 Z"  fill="#fdf8f2"/>

      <!-- Fold crease lines (gold, very subtle) -->
      <line x1="0"   y1="244" x2="200" y2="136" stroke="rgba(201,168,76,0.22)" stroke-width="0.8"/>
      <line x1="400" y1="244" x2="200" y2="136" stroke="rgba(201,168,76,0.22)" stroke-width="0.8"/>
      <line x1="0"   y1="0"   x2="200" y2="136" stroke="rgba(201,168,76,0.18)" stroke-width="0.7"/>
      <line x1="400" y1="0"   x2="200" y2="136" stroke="rgba(201,168,76,0.18)" stroke-width="0.7"/>

      <!-- Gold outer border -->
      <rect width="400" height="244" rx="8" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
      <!-- Inner gold frame -->
      <rect x="9" y="9" width="382" height="226" rx="5" fill="none" stroke="rgba(201,168,76,0.22)" stroke-width="0.8"/>

      <!-- Gold dot accents on border -->
      <g fill="rgba(201,168,76,0.45)">
        <circle cx="80"  cy="13"  r="1.5"/> <circle cx="200" cy="13"  r="1.5"/> <circle cx="320" cy="13"  r="1.5"/>
        <circle cx="80"  cy="231" r="1.5"/> <circle cx="200" cy="231" r="1.5"/> <circle cx="320" cy="231" r="1.5"/>
        <circle cx="13"  cy="82"  r="1.5"/> <circle cx="13"  cy="162" r="1.5"/>
        <circle cx="387" cy="82"  r="1.5"/> <circle cx="387" cy="162" r="1.5"/>
      </g>

      <!-- Corner flower — Top Left -->
      <g transform="translate(26, 23)" opacity="0.62">
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(288)"/>
        <circle  cx="0" cy="0"   r="3.8" fill="#f5c8a0"/>
        <circle  cx="0" cy="0"   r="1.5" fill="#e8a080" opacity="0.6"/>
      </g>
      <!-- Corner flower — Top Right -->
      <g transform="translate(374, 23)" opacity="0.62">
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(288)"/>
        <circle  cx="0" cy="0"   r="3.8" fill="#f5c8a0"/>
        <circle  cx="0" cy="0"   r="1.5" fill="#e8a080" opacity="0.6"/>
      </g>
      <!-- Corner flower — Bottom Left -->
      <g transform="translate(26, 221)" opacity="0.62">
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(288)"/>
        <circle  cx="0" cy="0"   r="3.8" fill="#f5c8a0"/>
        <circle  cx="0" cy="0"   r="1.5" fill="#e8a080" opacity="0.6"/>
      </g>
      <!-- Corner flower — Bottom Right -->
      <g transform="translate(374, 221)" opacity="0.62">
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#e8a0b0" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7.5" rx="3.2" ry="6"   fill="#dda090" transform="rotate(288)"/>
        <circle  cx="0" cy="0"   r="3.8" fill="#f5c8a0"/>
        <circle  cx="0" cy="0"   r="1.5" fill="#e8a080" opacity="0.6"/>
      </g>

      <!-- Small rose branches in bottom corners -->
      <g stroke="#C9A84C" stroke-width="0.7" fill="none" opacity="0.3">
        <path d="M18,210 Q30,200 28,188"/> <circle cx="28" cy="188" r="2" fill="#e8a0b0" stroke="none" opacity="0.4"/>
        <path d="M18,210 Q22,198 32,196"/> <circle cx="32" cy="196" r="1.5" fill="#e8a0b0" stroke="none" opacity="0.4"/>
      </g>
      <g stroke="#C9A84C" stroke-width="0.7" fill="none" opacity="0.3">
        <path d="M382,210 Q370,200 372,188"/> <circle cx="372" cy="188" r="2" fill="#e8a0b0" stroke="none" opacity="0.4"/>
        <path d="M382,210 Q378,198 368,196"/> <circle cx="368" cy="196" r="1.5" fill="#e8a0b0" stroke="none" opacity="0.4"/>
      </g>
    </svg>

    <!-- Wax seal overlaid at the center fold point -->
    <button id="wax-seal" onclick="openEnvelope()" aria-label="Ouvrir le cadeau">
      <!-- Embossed flower -->
      <svg width="44" height="44" viewBox="-22 -22 44 44" xmlns="http://www.w3.org/2000/svg">
        <g fill="rgba(255,236,218,0.88)">
          <ellipse cx="0" cy="-9.5" rx="4.2" ry="7.8"/>
          <ellipse cx="0" cy="-9.5" rx="4.2" ry="7.8" transform="rotate(72)"/>
          <ellipse cx="0" cy="-9.5" rx="4.2" ry="7.8" transform="rotate(144)"/>
          <ellipse cx="0" cy="-9.5" rx="4.2" ry="7.8" transform="rotate(216)"/>
          <ellipse cx="0" cy="-9.5" rx="4.2" ry="7.8" transform="rotate(288)"/>
          <circle cx="0" cy="0" r="5.8"/>
          <circle cx="0" cy="0" r="2.2" fill="rgba(150,30,50,0.55)"/>
        </g>
        <circle cx="0" cy="0" r="19" fill="none" stroke="rgba(255,230,200,0.18)" stroke-width="1"/>
      </svg>
    </button>
  </div>

  <p class="intro-hint">Brise le sceau ✦</p>
</div>


<!-- ══ SCENE 2 — GIFT CARDS ══ -->
<div id="scene-cards">

  <p class="cards-title">Tes soins t'attendent…</p>

  <div class="cards-row">

    <!-- Card 1: Soin Eye Lift -->
    <div class="gift-card">
      <!-- Floral watermark -->
      <svg class="card-wm" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(50,50)" fill="#C9A84C">
          <ellipse cx="0" cy="-24" rx="11" ry="20"/> <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(72)"/>
          <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(144)"/> <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(216)"/>
          <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(288)"/> <circle r="13"/>
        </g>
      </svg>

      <div class="card-header">
        <div class="card-brand">Guinot</div>
        <div class="card-subbrand">MC Beauté</div>
      </div>

      <div class="card-body">
        <!-- Eye icon -->
        <svg class="card-icon" viewBox="0 0 60 46" xmlns="http://www.w3.org/2000/svg"
             fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Eye outline -->
          <path d="M4,23 Q30,5 56,23 Q30,41 4,23 Z"/>
          <!-- Iris -->
          <circle cx="30" cy="23" r="8.5"/>
          <!-- Pupil -->
          <circle cx="30" cy="23" r="3.5" fill="#C9A84C" stroke="none"/>
          <!-- Lash lift lines -->
          <path d="M20,14 Q17,9 16,6" stroke-width="1.3"/>
          <path d="M30,11 Q30,6  30,3" stroke-width="1.3"/>
          <path d="M40,14 Q43,9  44,6" stroke-width="1.3"/>
          <!-- Sparkle (lift) -->
          <path d="M50,9 L51,6.5 L52,9 L54.5,10 L52,11 L51,13.5 L50,11 L47.5,10 Z"
                fill="#C9A84C" stroke="none" opacity="0.8"/>
        </svg>

        <div class="card-divider"></div>
        <p class="card-product">Soin Eye Lift</p>
        <p class="card-type">Contour des Yeux</p>
      </div>

      <div class="card-footer">
        <p class="card-gift">1 soin offert ❤️</p>
      </div>
    </div>

    <!-- Card 2: Soin Mirific Relax -->
    <div class="gift-card">
      <!-- Floral watermark -->
      <svg class="card-wm" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(50,50)" fill="#C9A84C">
          <ellipse cx="0" cy="-24" rx="11" ry="20"/> <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(72)"/>
          <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(144)"/> <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(216)"/>
          <ellipse cx="0" cy="-24" rx="11" ry="20" transform="rotate(288)"/> <circle r="13"/>
        </g>
      </svg>

      <div class="card-header">
        <div class="card-brand">Guinot</div>
        <div class="card-subbrand">MC Beauté</div>
      </div>

      <div class="card-body">
        <!-- Lotus / relax icon -->
        <svg class="card-icon" viewBox="0 0 60 58" xmlns="http://www.w3.org/2000/svg"
             fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Central petal -->
          <path d="M30,50 Q14,40 17,22 Q23,10 30,7 Q37,10 43,22 Q46,40 30,50 Z"/>
          <!-- Left petal -->
          <path d="M30,50 Q10,44 7,26 Q5,12 18,9 Q12,22 17,32 Q22,40 30,50 Z" opacity="0.75"/>
          <!-- Right petal -->
          <path d="M30,50 Q50,44 53,26 Q55,12 42,9 Q48,22 43,32 Q38,40 30,50 Z" opacity="0.75"/>
          <!-- Stem -->
          <path d="M30,50 Q28,55 30,57" stroke-width="1.2"/>
          <!-- Pollen dots -->
          <circle cx="30" cy="28" r="2.2" fill="#C9A84C" stroke="none"/>
          <circle cx="26" cy="33" r="1.6" fill="#C9A84C" stroke="none" opacity="0.55"/>
          <circle cx="34" cy="33" r="1.6" fill="#C9A84C" stroke="none" opacity="0.55"/>
          <!-- Dew drop -->
          <path d="M40,15 Q42,12 44,15 Q42,18 40,15 Z" fill="#C9A84C" stroke="none" opacity="0.5"/>
        </svg>

        <div class="card-divider"></div>
        <p class="card-product">Soin Mirific<br>Relax</p>
        <p class="card-type">Soin Visage</p>
      </div>

      <div class="card-footer">
        <p class="card-gift">1 soin offert ❤️</p>
      </div>
    </div>

  </div>

  <div class="bday-block">
    <p class="bday-main">Bon anniversaire Maman 🎂</p>
    <p class="bday-sub">avec tout mon amour ❤️</p>
  </div>

</div>


<script>
/* ── PETALS ── */
const PETAL_COLS = ['#f0b8c4','#e8a0b0','#fddde8','#f8e0d0','#f5d0b8','#f0c8d0','#e8d0e0'];
const petalWrap = document.getElementById('petals');

function makePetal() {
  const el = document.createElement('div');
  el.className = 'petal';
  el.style.left = (Math.random() * 110 - 5) + 'vw';
  const dur = 9 + Math.random() * 10;
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = (Math.random() * 2) + 's';

  const c = PETAL_COLS[Math.random() * PETAL_COLS.length | 0];
  const s = 8 + Math.random() * 7;
  const r = Math.random() * 360 | 0;
  // two petal shapes alternating
  const shape = Math.random() > 0.5
    ? `M11,2 Q20,7 18,16 Q15,23 11,26 Q7,23 5,16 Q3,7 11,2Z`
    : `M11,2 Q22,10 18,18 Q14,25 11,26 Q8,25 4,18 Q0,10 11,2Z`;

  el.innerHTML = `<svg width="${s*2.2}" height="${s*2.8}" viewBox="0 0 22 28" xmlns="http://www.w3.org/2000/svg">
    <g transform="rotate(${r},11,14)">
      <path d="${shape}" fill="${c}" opacity="0.72"/>
      <path d="M11,2 C11,2 11,27 11,26" stroke="rgba(255,255,255,0.3)" stroke-width="0.7" fill="none"/>
    </g>
  </svg>`;
  petalWrap.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// Initial petals
for (let i = 0; i < 14; i++) setTimeout(makePetal, i * 300);
setInterval(makePetal, 600);

/* ── BURST ── */
function burst(x, y, n = 28) {
  const cols = ['#C9A84C','#e8d080','#f0b8c4','#e8a0b0','#ffffff','#8B1A2F','#f5d0b8','#fddde8'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    const ang = Math.random() * Math.PI * 2;
    const d   = 40 + Math.random() * 170;
    el.style.setProperty('--tx', Math.cos(ang) * d + 'px');
    el.style.setProperty('--ty', Math.sin(ang) * d + 'px');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.background = cols[Math.random() * cols.length | 0];
    const sz = 4 + Math.random() * 9;
    el.style.width = el.style.height = sz + 'px';
    el.style.animationDuration = (0.7 + Math.random() * 0.65) + 's';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ── OPEN ENVELOPE ── */
function openEnvelope() {
  const seal = document.getElementById('wax-seal');
  const envC = document.getElementById('env-container');
  seal.onclick = null;

  const r  = seal.getBoundingClientRect();
  const cx = r.left + r.width  / 2;
  const cy = r.top  + r.height / 2;

  // Break seal
  seal.classList.add('breaking');

  // Particle bursts
  setTimeout(() => burst(cx, cy, 35), 130);
  setTimeout(() => burst(cx, cy, 20), 380);

  // Fade envelope
  setTimeout(() => envC.classList.add('opening'), 480);

  // Switch scene
  setTimeout(() => {
    document.getElementById('scene-intro').style.display = 'none';
    document.getElementById('scene-cards').style.display = 'flex';
  }, 940);

  // Celebration
  setTimeout(() => {
    for (let i = 0; i < 8; i++) {
      setTimeout(() => burst(
        innerWidth  * 0.08 + Math.random() * innerWidth  * 0.84,
        innerHeight * 0.08 + Math.random() * innerHeight * 0.65
      ), i * 110);
    }
    for (let i = 0; i < 24; i++) setTimeout(makePetal, i * 75);
  }, 1020);
}
</script>
</body>
